name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

# Pure data-layer tests (parsers, plan composition, formatters). Everything
# that touches real ZFS state — deploy, mirror, default, etc. on a live
# pool — is covered by `scripts/*.sh` in QEMU and intentionally NOT run
# in CI (no ZFS kernel modules in GitHub-hosted runners).

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; the action reads it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `embed-efi` is the default feature; without an actual
      # `zboot-boot.efi` on disk the build.rs emits an empty
      # placeholder. The resulting `zboot` CLI is fully functional
      # for snapshot / fork / default / push / pull / mirror /
      # status / etc. — the placeholder only matters for `zboot esp`
      # and `zboot deploy` (which need a real bootloader to flash).
      - name: cargo build --release -p zboot-cli
        run: cargo build --release -p zboot-cli

      - name: cargo test --workspace
        run: cargo test --workspace --all-targets

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets

      # Upload the userspace CLI binary as an artifact on every push.
      # Useful for: trying zboot without a local Rust toolchain, or
      # dropping the binary onto an already-deployed system.
      - name: upload zboot binary
        uses: actions/upload-artifact@v4
        with:
          name: zboot-x86_64-linux
          path: target/release/zboot
          retention-days: 30
          if-no-files-found: error

  # Tag-triggered release: attach the binary to a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zboot-x86_64-linux

      - name: rename binary with target triple
        run: mv zboot zboot-${{ github.ref_name }}-x86_64-linux

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: zboot-${{ github.ref_name }}-x86_64-linux
          draft: false
          prerelease: false
          generate_release_notes: true
