# Start the root console immediately. Once DHCP configures an IPv4 address,
# announce it from this getty's control group (hostname -I; networkd keeps no
# lease file), with no wait-online target or extra package. login hangs up
# the terminal (vhangup), so the announcer ignores SIGHUP and opens the
# terminal afresh to write.
[Service]
KillMode=control-group
ExecStart=
ExecStart=-/bin/sh -c '( trap "" HUP; while :; \
    do for address in $$(hostname -I 2> /dev/null); \
    do case "$$address" in ""|*[!0-9.]*|.*|*.|*..*|169.254.*) continue ;; \
    esac; \
    printf "\\nRescue IPv4: %%s\\n" "$$address" >> /dev/%I; \
    exit 0; \
    done; \
    sleep 1; \
    done ) & exec /sbin/agetty --noreset --noclear --autologin root - "$${TERM}"'
