[workspace]
members = ["core", "cli", "boot"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
# `deny` (not `forbid`) so individual modules that genuinely need unsafe
# can opt in via `#![allow(unsafe_code)]`. `forbid` would block our
# `boot/src/preinit.rs` (PID-1 mounts /proc, /sys, /dev via `nix::mount`,
# and any future direct syscall path for kexec/kmod). Every other
# module is expected to remain unsafe-free.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
