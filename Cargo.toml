[workspace]
members = ["crates/zfs-tools", "crates/zboot", "crates/zsnap", "crates/zboot-helpers"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
sha2 = "0.10"
libc = "0.2"
rustix = { version = "1.1.4", features = ["event", "fs", "process", "termios"] }
nix = { version = "0.31", features = ["sched", "mount", "process", "signal", "user", "socket"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
strip = true
